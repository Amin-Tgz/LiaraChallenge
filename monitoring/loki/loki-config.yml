auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  allow_structured_metadata: true
  # The compactor initializes a delete-request store whenever deletion is
  # enabled for a tenant. Loki's default deletion_mode is delete-enabled, so
  # retention_enabled: false alone is not sufficient: the compactor still tries
  # to open the delete store on the Liara persistent disk and times out
  # ("init compactor: failed to init delete store: timeout"), which aborts
  # startup. Deletion is not a requirement for this deployment, so turn it off
  # explicitly and the compactor skips the delete store entirely.
  deletion_mode: disabled

compactor:
  working_directory: /loki/compactor
  retention_enabled: false

analytics:
  reporting_enabled: false
