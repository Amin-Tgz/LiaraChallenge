[project]
name = "liara-docs-rescue"
version = "0.1.0"
description = "Liara Documentation Rescue Assistant"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "sqlalchemy==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.14.0",
    "pgvector==0.3.6",
    "redis==5.2.1",
    "httpx==0.28.1",
    "openai==1.59.6",
    "mistune==3.0.2",
    "tiktoken==0.8.0",
    "python-multipart==0.0.20",
    "structlog==24.4.0",
    "prometheus-client==0.26.0",
    "opentelemetry-sdk==1.44.0",
    "opentelemetry-exporter-otlp-proto-http==1.44.0",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.1",
    "ruff==0.8.6",
    "anyio==4.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Autogenerated migrations render constraint SQL on one line; rewrapping them
# by hand would diverge from what the next autogenerate produces.
"alembic/versions/*.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
